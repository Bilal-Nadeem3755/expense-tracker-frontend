<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16A085"/>
      <stop offset="100%" stop-color="#0D6E5A"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect x="0" y="0" width="32" height="32" rx="7" fill="url(#bg)"/>

  <!-- wallet body -->
  <rect x="6" y="9" width="20" height="15" rx="3" fill="#F4F9F7"/>

  <!-- wallet fold shadow line -->
  <path d="M6 13 H26" stroke="#CFE7DF" stroke-width="1.2"/>

  <!-- wallet flap -->
  <path d="M6 12 V11 C6 9.3 7.3 8 9 8 H21 C22.7 8 24 9.3 24 11 V12 Z" fill="#0D6E5A"/>

  <!-- coin / clasp -->
  <circle cx="21.5" cy="16.5" r="2.6" fill="#16A085"/>
  <circle cx="21.5" cy="16.5" r="2.6" fill="none" stroke="#0D6E5A" stroke-width="0.8"/>

  <!-- little uptrend arrow (tracking growth) -->
  <path d="M9.5 20.5 L12.5 17.5 L14.5 19.5 L18 15.5" stroke="#16A085" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M15.7 15.5 H18 V17.8" stroke="#16A085" stroke-width="1.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
